<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro – AQUA</title>

  <!-- 🔑 CSS CORRECTO -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/botones.css">
</head>


<body>

  <div class="form-container">
    <h1>AQUA</h1>
    <p>Servicios profesionales de plomería</p>

    <form onsubmit="registrar(event)">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="email" id="correo" placeholder="Correo electrónico" required>
      <input type="password" id="contrasena" placeholder="Contraseña" required>

      <select id="pregunta" required>
        <option value="">Seleccione una pregunta</option>
        <option value="mascota">¿Nombre de tu primera mascota?</option>
        <option value="escuela">¿Nombre de tu escuela?</option>
        <option value="ciudad">¿Ciudad donde naciste?</option>
      </select>

      <input type="text" id="respuesta" placeholder="Respuesta de seguridad" required>

      <button type="submit">Registrarse</button>
    </form>

    <p>
      ¿Ya tienes cuenta?
      <a href="index.html">Inicia sesión</a>
    </p>
  </div>

  <!-- JS correcto -->
  <script src="js/registro.js"></script>
</body>

</html>
