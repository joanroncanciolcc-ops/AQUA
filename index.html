<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AQUA | Iniciar Sesión</title>
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-body">

  <div class="login-card">
    <img src="img/logo-aqua.png" alt="AQUA" class="login-logo">

    <h1>AQUA</h1>
    <p class="subtitle">Servicios profesionales de plomería</p>

    <form onsubmit="login(event)">
      <label>Correo electrónico</label>
      <input type="email" id="correo" placeholder="tu@correo.com" required>

      <label>Contraseña</label>
      <input type="password" id="contrasena" placeholder="••••••••" required>

      <button type="submit">Iniciar Sesión</button>
    </form>

    <a href="recuperar.html" class="link">¿Olvidaste tu contraseña?</a>
    <p class="register">
      ¿No tienes cuenta?
      <a href="registro.html">Regístrate aquí</a>
    </p>
  </div>
 
<script src="js/login.js"></script> 
</body>
</html>
